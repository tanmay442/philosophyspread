name: Build + Fallow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-fallow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect maintainer bypass flag
        id: bypass
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          FLAG='[skip-tanmay-gates]'
          BYPASS='false'

          if [ "$ACTOR" = "tanmay442" ] && [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/master" ]; then
            if printf '%s' "$HEAD_COMMIT_MESSAGE" | grep -Fqi "$FLAG"; then
              BYPASS='true'
            fi
          fi

          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"
          echo "bypass=$BYPASS" >> "$GITHUB_OUTPUT"

      - name: Bypass acknowledged
        if: steps.bypass.outputs.bypass == 'true'
        run: |
          echo "Maintainer bypass enabled by tanmay442 using flag: ${{ steps.bypass.outputs.flag }}"
          echo "Skipping build + fallow for this direct master push."

      - name: Setup pnpm
        if: steps.bypass.outputs.bypass != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node
        if: steps.bypass.outputs.bypass != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.bypass.outputs.bypass != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.bypass.outputs.bypass != 'true'
        run: pnpm lint

      - name: Astro check
        if: steps.bypass.outputs.bypass != 'true'
        run: pnpm check

      - name: Unit tests
        if: steps.bypass.outputs.bypass != 'true'
        run: pnpm test

      - name: Build check
        if: steps.bypass.outputs.bypass != 'true'
        run: pnpm build

      - name: Run fallow and analyze report (log-only, no artifact)
        if: steps.bypass.outputs.bypass != 'true'
        id: fallow
        shell: bash
        run: |
          set +e
          set -o pipefail

          REPORT_PATH="$RUNNER_TEMP/fallow-report.json"
          pnpm fallow --no-cache --config .github/fallow.ci.json --format json | tee "$REPORT_PATH"
          FALLOW_EXIT=${PIPESTATUS[0]}
          set +o pipefail

          REPORT_VALID='false'
          if jq -e '(.check.summary and .dupes and .health)' "$REPORT_PATH" >/dev/null 2>&1; then
            REPORT_VALID='true'
          fi

          BLOCKING_CODE_COUNT=$(jq '[
            .check.summary.unused_files,
            .check.summary.unused_exports,
            .check.summary.unused_types,
            .check.summary.unused_dependencies,
            .check.summary.unused_dev_dependencies,
            .check.summary.unused_optional_dependencies,
            .check.summary.unused_enum_members,
            .check.summary.unused_class_members,
            .check.summary.unresolved_imports,
            .check.summary.unlisted_dependencies,
            .check.summary.duplicate_exports,
            .check.summary.circular_dependencies,
            .check.summary.re_export_cycles,
            .check.summary.boundary_violations,
            .check.summary.unresolved_catalog_references,
            .check.summary.misconfigured_dependency_overrides,
            .check.summary.route_collisions,
            .check.summary.dynamic_segment_name_conflicts
          ] | map(. // 0) | add' "$REPORT_PATH" 2>/dev/null || echo 0)

          # Known-intentional clone groups (see source-level comments and rationale below).
          # These are filtered by fingerprint so NEW duplication in the same files is still caught.
          #   dup:d9ffbf4e  HeroBlock.astro  <a>/<div> wrapper conditional (3 lines of static markup)
          #   dup:32f5b325  LogicModules.astro ↔ logic-modules/page/[page].astro  card grid mirror
          #   dup:21dd34f0  bits/page/[page].astro ↔ logic-modules/page/[page].astro  archive shell
          #   dup:9f003af2  bits/page/[page].astro ↔ essays/page/[page].astro ↔ logic-modules/page/[page].astro  archive shell
          KNOWN_DUPLICATE_FINGERPRINTS='["dup:d9ffbf4e","dup:32f5b325","dup:21dd34f0","dup:9f003af2"]'
          DUPLICATE_COUNT=$(jq --argjson known "$KNOWN_DUPLICATE_FINGERPRINTS" '
            [(.dupes.clone_groups // [])[] | .fingerprint as $fp | select($known | index($fp) | not)] | length
          ' "$REPORT_PATH" 2>/dev/null || echo 0)
          HEALTH_FINDING_COUNT=$(jq '(.health.findings // []) | length' "$REPORT_PATH" 2>/dev/null || echo 0)

          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          echo "exit_code=$FALLOW_EXIT" >> "$GITHUB_OUTPUT"
          echo "report_valid=$REPORT_VALID" >> "$GITHUB_OUTPUT"
          echo "blocking_code_count=$BLOCKING_CODE_COUNT" >> "$GITHUB_OUTPUT"
          echo "duplicate_count=$DUPLICATE_COUNT" >> "$GITHUB_OUTPUT"
          echo "health_finding_count=$HEALTH_FINDING_COUNT" >> "$GITHUB_OUTPUT"

          echo "---- Fallow summary ----"
          echo "exit_code=$FALLOW_EXIT"
          echo "report_valid=$REPORT_VALID"
          echo "blocking_code_count=$BLOCKING_CODE_COUNT"
          echo "duplicate_count=$DUPLICATE_COUNT (after filtering known-intentional groups)"
          echo "health_finding_count=$HEALTH_FINDING_COUNT (non-blocking maintainability findings)"

          # Never fail here; gating is done after notification/comment steps.
          exit 0

      - name: Post single fallow report comment
        if: always() && steps.bypass.outputs.bypass != 'true'
        uses: actions/github-script@v9
        env:
          REPORT_PATH: ${{ steps.fallow.outputs.report_path }}
          REPORT_VALID: ${{ steps.fallow.outputs.report_valid }}
          BLOCKING_CODE_COUNT: ${{ steps.fallow.outputs.blocking_code_count }}
          DUPLICATE_COUNT: ${{ steps.fallow.outputs.duplicate_count }}
          HEALTH_FINDING_COUNT: ${{ steps.fallow.outputs.health_finding_count }}
          FALLOW_EXIT_CODE: ${{ steps.fallow.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const reportValid = process.env.REPORT_VALID === 'true';
            const blocking = Number(process.env.BLOCKING_CODE_COUNT || '0');
            const dupes = Number(process.env.DUPLICATE_COUNT || '0');
            const health = Number(process.env.HEALTH_FINDING_COUNT || '0');
            const exitCode = process.env.FALLOW_EXIT_CODE || '0';

            const lines = [
              `@${context.actor} Fallow checks detected issues.`,
              '',
              `- Fallow exit code: ${exitCode}`,
              `- Report valid: ${reportValid}`,
              `- Blocking code findings: ${blocking}`,
              `- Duplicate clone groups: ${dupes}`,
              `- Maintainability findings: ${health}`,
              '',
              blocking > 0
                ? 'Blocking code findings were found; this run will be failed to block merge/promotion.'
                : 'No blocking code findings detected.',
              dupes > 0
                ? 'Duplicate code detected. Please review and refactor where appropriate.'
                : 'No duplication warnings.',
              health > 0
                ? 'Maintainability findings are reported for follow-up and do not block this run.'
                : 'No maintainability findings.',
            ];
            const summaryBody = lines.join('\n');

            const { owner, repo } = context.repo;

            if (context.eventName === 'pull_request') {
              const reportMarker = '<!-- fallow-full-report-pr -->';
              const staleMarkers = [
                '<!-- fallow-summary -->',
                '<!-- ai-review-gate-guidance -->',
              ];
              const reportPath = process.env.REPORT_PATH;
              let report = reportPath && fs.existsSync(reportPath) ? fs.readFileSync(reportPath, 'utf8') : 'No fallow report found.';

              const maxLen = 60000;
              if (report.length > maxLen) {
                report = report.slice(0, maxLen) + '\n\n... [truncated due to comment size limits]';
              }

              const reportBody =
                `${reportMarker}\n` +
                '# Fallow Report\n\n' +
                `Actor: @${context.actor}\n\n` +
                `## Summary\n\n` +
                `- Fallow exit code: ${exitCode}\n` +
                `- Report valid: ${reportValid}\n` +
                `- Blocking code findings: ${blocking}\n` +
                `- Duplicate clone groups: ${dupes}\n` +
                `- Maintainability findings: ${health}\n\n` +
                (blocking > 0
                  ? 'Blocking code findings were found; this run will be failed to block merge/promotion.\n\n'
                  : 'No blocking code findings detected.\n\n') +
                (dupes > 0
                  ? 'Duplicate code detected. Please review and refactor where appropriate.\n\n'
                  : 'No duplication warnings.\n\n') +
                (health > 0
                  ? 'Maintainability findings are reported for follow-up and do not block this run.\n\n'
                  : 'No maintainability findings.\n\n') +
                '<details><summary>Open full fallow report</summary>\n\n' +
                '```json\n' +
                `${report}\n` +
                '```\n\n' +
                '</details>';

              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });

              const existingReport = comments.find((c) => c.body && c.body.includes(reportMarker));
              if (existingReport) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existingReport.id, body: reportBody });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: reportBody });
              }

              // Remove comments created by older workflow versions.
              for (const comment of comments.filter((c) =>
                c.body && staleMarkers.some((marker) => c.body.includes(marker)))) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              }
            } else if (!reportValid || blocking > 0 || dupes > 0 || health > 0) {
              await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha: context.sha,
                body: summaryBody,
              });
            }

      - name: Fail when blocking Fallow findings are detected
        if: always() && steps.bypass.outputs.bypass != 'true' && (steps.fallow.outputs.report_valid != 'true' || steps.fallow.outputs.blocking_code_count != '0')
        run: |
          echo "❌ Blocking: fallow reported blocking code findings or did not produce a valid report."
          echo "blocking_code_count=${{ steps.fallow.outputs.blocking_code_count }}"
          echo "report_valid=${{ steps.fallow.outputs.report_valid }}"
          echo "fallow_exit_code=${{ steps.fallow.outputs.exit_code }}"
          exit 1

      - name: Duplicate warning only (non-blocking)
        if: always() && steps.bypass.outputs.bypass != 'true' && steps.fallow.outputs.duplicate_count != '0'
        run: |
          echo "⚠️ Duplicate code warning: new clone_groups=${{ steps.fallow.outputs.duplicate_count }}"
          echo "Known-intentional groups are filtered; see .github/workflows/build-fallow.yml for the list."
          echo "Please review duplication findings in the log and refactor if needed."
