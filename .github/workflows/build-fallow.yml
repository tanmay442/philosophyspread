name: Build + Fallow + AI Review Guidance

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-fallow:
    runs-on: ubuntu-latest
    outputs:
      bypass: ${{ steps.bypass.outputs.bypass }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect maintainer bypass flag
        id: bypass
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          FLAG='[skip-tanmay-gates]'
          BYPASS='false'

          if [ "$ACTOR" = "tanmay442" ] && [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            if printf '%s' "$HEAD_COMMIT_MESSAGE" | grep -Fqi "$FLAG"; then
              BYPASS='true'
            fi
          fi

          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"
          echo "bypass=$BYPASS" >> "$GITHUB_OUTPUT"

      - name: Bypass acknowledged
        if: steps.bypass.outputs.bypass == 'true'
        run: |
          echo "Maintainer bypass enabled by tanmay442 using flag: ${{ steps.bypass.outputs.flag }}"
          echo "Skipping build + fallow for this direct main push."

      - name: Setup Node
        if: steps.bypass.outputs.bypass != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        if: steps.bypass.outputs.bypass != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        if: steps.bypass.outputs.bypass != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build check
        if: steps.bypass.outputs.bypass != 'true'
        run: pnpm build

      - name: Run fallow and analyze report (log-only, no artifact)
        if: steps.bypass.outputs.bypass != 'true'
        id: fallow
        shell: bash
        run: |
          set +e

          REPORT_PATH="$RUNNER_TEMP/fallow-report.json"
          npx --yes fallow --config .github/fallow.ci.json --format json | tee "$REPORT_PATH"
          FALLOW_EXIT=$?

          DEAD_CODE_COUNT=$(jq '(
            .check.summary.unused_files +
            .check.summary.unused_exports +
            .check.summary.unused_types +
            .check.summary.unused_dependencies +
            .check.summary.unused_enum_members +
            .check.summary.unused_class_members +
            .check.summary.type_only_dependencies +
            .check.summary.test_only_dependencies +
            .check.summary.circular_dependencies
          ) // 0' "$REPORT_PATH")

          DUPLICATE_COUNT=$(jq '.dupes.stats.clone_groups // 0' "$REPORT_PATH")

          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          echo "exit_code=$FALLOW_EXIT" >> "$GITHUB_OUTPUT"
          echo "dead_code_count=$DEAD_CODE_COUNT" >> "$GITHUB_OUTPUT"
          echo "duplicate_count=$DUPLICATE_COUNT" >> "$GITHUB_OUTPUT"

          echo "---- Fallow summary ----"
          echo "exit_code=$FALLOW_EXIT"
          echo "dead_code_count=$DEAD_CODE_COUNT"
          echo "duplicate_count=$DUPLICATE_COUNT"

          # Never fail here; gating is done after notification/comment steps.
          exit 0

      - name: Post fallow report for PRs to main/master (for Copilot context)
        if: always() && steps.bypass.outputs.bypass != 'true' && github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master')
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.fallow.outputs.report_path }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- fallow-full-report-main-pr -->';
            const reportPath = process.env.REPORT_PATH;
            let report = reportPath && fs.existsSync(reportPath) ? fs.readFileSync(reportPath, 'utf8') : 'No fallow report found.';

            const maxLen = 60000;
            if (report.length > maxLen) {
              report = report.slice(0, maxLen) + '\n\n... [truncated due to comment size limits]';
            }

            const body =
              `${marker}\n` +
              '# Fallow Report (full JSON)\n\n' +
              `Actor: @${context.actor}\n\n` +
              '<details><summary>Open full fallow report</summary>\n\n' +
              '```json\n' +
              `${report}\n` +
              '```\n\n' +
              '</details>';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Notify actor on dead code / duplicates
        if: always() && steps.bypass.outputs.bypass != 'true' && (steps.fallow.outputs.dead_code_count != '0' || steps.fallow.outputs.duplicate_count != '0' || steps.fallow.outputs.exit_code != '0')
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor;
            const dead = Number('${{ steps.fallow.outputs.dead_code_count }}' || '0');
            const dupes = Number('${{ steps.fallow.outputs.duplicate_count }}' || '0');
            const exitCode = '${{ steps.fallow.outputs.exit_code }}';

            const lines = [
              `@${actor} Fallow checks detected issues.`,
              '',
              `- Fallow exit code: ${exitCode}`,
              `- Dead code findings: ${dead}`,
              `- Duplicate clone groups: ${dupes}`,
              '',
              dead > 0
                ? 'Dead code was found; this run will be failed to block merge/promotion.'
                : 'No dead code detected.',
              dupes > 0
                ? 'Duplicate code detected. Please review and refactor where appropriate.'
                : 'No duplication warnings.',
            ];

            const body = lines.join('\n');
            const { owner, repo } = context.repo;

            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha: context.sha,
                body,
              });
            }

      - name: Fail when dead code is detected
        if: always() && steps.bypass.outputs.bypass != 'true' && (steps.fallow.outputs.dead_code_count != '0' || steps.fallow.outputs.exit_code != '0')
        run: |
          echo "❌ Blocking: dead code found (or fallow failed to run cleanly)."
          echo "dead_code_count=${{ steps.fallow.outputs.dead_code_count }}"
          echo "fallow_exit_code=${{ steps.fallow.outputs.exit_code }}"
          exit 1

      - name: Duplicate warning only (non-blocking)
        if: always() && steps.bypass.outputs.bypass != 'true' && steps.fallow.outputs.duplicate_count != '0'
        run: |
          echo "⚠️ Duplicate code warning: clone_groups=${{ steps.fallow.outputs.duplicate_count }}"
          echo "Please review duplication findings in the log and refactor if needed."

  ai-review-gate:
    needs: build-fallow
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master') && needs.build-fallow.outputs.bypass != 'true'

    steps:
      - name: Post / update Copilot guidance comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ai-review-gate-guidance -->';
            const body =
              `${marker}\n` +
              '# AI Review Guidance\n\n' +
              '@copilot Please review this PR.\n\n' +
              'Guidance:\n' +
              '- Do **not** over-focus on hotspots if the code is already clean and understandable.\n' +
              '- Prioritize standards compliance, correctness, maintainability, and meaningful improvements.\n' +
              '- If better implementation choices exist, prioritize those suggestions clearly.\n\n' +
              'Use the latest Fallow report comment in this PR as analysis context.\n' +
              'Look for comment marker: <!-- fallow-full-report-main-pr --> and prioritize findings from that JSON report.';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Best-effort request Copilot as reviewer
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ['copilot'],
              });
              core.info('Requested copilot as reviewer.');
            } catch (error) {
              core.warning(`Could not request copilot reviewer automatically: ${error.message}`);
            }
