name: Build + Fallow + AI Review Guidance

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-fallow:
    runs-on: ubuntu-latest
    outputs:
      bypass: ${{ steps.bypass.outputs.bypass }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect maintainer bypass flag
        id: bypass
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          FLAG='[skip-tanmay-gates]'
          BYPASS='false'

          if [ "$ACTOR" = "tanmay442" ] && [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            if printf '%s' "$HEAD_COMMIT_MESSAGE" | grep -Fqi "$FLAG"; then
              BYPASS='true'
            fi
          fi

          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"
          echo "bypass=$BYPASS" >> "$GITHUB_OUTPUT"

      - name: Bypass acknowledged
        if: steps.bypass.outputs.bypass == 'true'
        run: |
          echo "Maintainer bypass enabled by tanmay442 using flag: ${{ steps.bypass.outputs.flag }}"
          echo "Skipping build + fallow for this direct main push."

      - name: Setup pnpm
        if: steps.bypass.outputs.bypass != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node
        if: steps.bypass.outputs.bypass != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.bypass.outputs.bypass != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.bypass.outputs.bypass != 'true'
        run: pnpm lint

      - name: Astro check
        if: steps.bypass.outputs.bypass != 'true'
        run: pnpm astro check

      - name: Build check
        if: steps.bypass.outputs.bypass != 'true'
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: Run fallow and analyze report (log-only, no artifact)
        if: steps.bypass.outputs.bypass != 'true'
        id: fallow
        shell: bash
        run: |
          set +e

          REPORT_PATH="$RUNNER_TEMP/fallow-report.json"
          pnpm fallow --config .github/fallow.ci.json --format json | tee "$REPORT_PATH"
          FALLOW_EXIT=$?

          DEAD_CODE_COUNT=$(jq '(
            .check.summary.unused_files +
            .check.summary.unused_exports +
            .check.summary.unused_types +
            .check.summary.unused_dependencies +
            .check.summary.unused_enum_members +
            .check.summary.unused_class_members +
            .check.summary.type_only_dependencies +
            .check.summary.test_only_dependencies +
            .check.summary.circular_dependencies
          ) // 0' "$REPORT_PATH")

          # Known-intentional clone groups (see source-level comments and rationale below).
          # These are filtered by fingerprint so NEW duplication in the same files is still caught.
          #   dup:d9ffbf4e  HeroBlock.astro  <a>/<div> wrapper conditional (3 lines of static markup)
          #   dup:0106bc70  LogicModules.astro ↔ logic-modules/page/[page].astro  card grid mirror
          #   dup:2cf8e3a5  authors/contribute/terms  shared page header skeleton
          #   dup:0dad0c89  authors/contribute  shared article + Prose + Footer block
          KNOWN_DUPLICATE_FINGERPRINTS='["dup:d9ffbf4e","dup:0106bc70","dup:2cf8e3a5","dup:0dad0c89"]'
          DUPLICATE_COUNT=$(jq --argjson known "$KNOWN_DUPLICATE_FINGERPRINTS" '
            [.dupes.clone_groups[] | .fingerprint as $fp | select($known | index($fp) | not)] | length
          ' "$REPORT_PATH")

          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          echo "exit_code=$FALLOW_EXIT" >> "$GITHUB_OUTPUT"
          echo "dead_code_count=$DEAD_CODE_COUNT" >> "$GITHUB_OUTPUT"
          echo "duplicate_count=$DUPLICATE_COUNT" >> "$GITHUB_OUTPUT"

          echo "---- Fallow summary ----"
          echo "exit_code=$FALLOW_EXIT"
          echo "dead_code_count=$DEAD_CODE_COUNT"
          echo "duplicate_count=$DUPLICATE_COUNT (after filtering known-intentional groups)"

          # Never fail here; gating is done after notification/comment steps.
          exit 0

      - name: Post fallow summary + report comment
        if: always() && steps.bypass.outputs.bypass != 'true'
        uses: actions/github-script@v9
        env:
          REPORT_PATH: ${{ steps.fallow.outputs.report_path }}
          DEAD_CODE_COUNT: ${{ steps.fallow.outputs.dead_code_count }}
          DUPLICATE_COUNT: ${{ steps.fallow.outputs.duplicate_count }}
          FALLOW_EXIT_CODE: ${{ steps.fallow.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const dead = Number(process.env.DEAD_CODE_COUNT || '0');
            const dupes = Number(process.env.DUPLICATE_COUNT || '0');
            const exitCode = process.env.FALLOW_EXIT_CODE || '0';

            const lines = [
              `@${context.actor} Fallow checks detected issues.`,
              '',
              `- Fallow exit code: ${exitCode}`,
              `- Dead code findings: ${dead}`,
              `- Duplicate clone groups: ${dupes}`,
              '',
              dead > 0
                ? 'Dead code was found; this run will be failed to block merge/promotion.'
                : 'No dead code detected.',
              dupes > 0
                ? 'Duplicate code detected. Please review and refactor where appropriate.'
                : 'No duplication warnings.',
            ];
            const summaryBody = lines.join('\n');

            const { owner, repo } = context.repo;

            if (context.eventName === 'pull_request') {
              const reportMarker = '<!-- fallow-full-report-main-pr -->';
              const summaryMarker = '<!-- fallow-summary -->';
              const reportPath = process.env.REPORT_PATH;
              let report = reportPath && fs.existsSync(reportPath) ? fs.readFileSync(reportPath, 'utf8') : 'No fallow report found.';

              const maxLen = 60000;
              if (report.length > maxLen) {
                report = report.slice(0, maxLen) + '\n\n... [truncated due to comment size limits]';
              }

              const reportBody =
                `${reportMarker}\n` +
                '# Fallow Report (full JSON)\n\n' +
                `Actor: @${context.actor}\n\n` +
                `Summary:\n` +
                `- Fallow exit code: ${exitCode}\n` +
                `- Dead code findings: ${dead}\n` +
                `- Duplicate clone groups: ${dupes}\n\n` +
                '<details><summary>Open full fallow report</summary>\n\n' +
                '```json\n' +
                `${report}\n` +
                '```\n\n' +
                '</details>';

              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });

              const existingReport = comments.find((c) => c.body && c.body.includes(reportMarker));
              if (existingReport) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existingReport.id, body: reportBody });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: reportBody });
              }

              if (dead > 0 || dupes > 0 || exitCode !== '0') {
                const summary = `${summaryMarker}\n${summaryBody}`;
                const existingSummary = comments.find((c) => c.body && c.body.includes(summaryMarker));
                if (existingSummary) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existingSummary.id, body: summary });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number, body: summary });
                }
              }
            } else if (dead > 0 || dupes > 0 || exitCode !== '0') {
              await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha: context.sha,
                body: summaryBody,
              });
            }

      - name: Fail when dead code is detected
        if: always() && steps.bypass.outputs.bypass != 'true' && (steps.fallow.outputs.dead_code_count != '0' || steps.fallow.outputs.exit_code != '0')
        run: |
          echo "❌ Blocking: dead code found (or fallow failed to run cleanly)."
          echo "dead_code_count=${{ steps.fallow.outputs.dead_code_count }}"
          echo "fallow_exit_code=${{ steps.fallow.outputs.exit_code }}"
          exit 1

      - name: Duplicate warning only (non-blocking)
        if: always() && steps.bypass.outputs.bypass != 'true' && steps.fallow.outputs.duplicate_count != '0'
        run: |
          echo "⚠️ Duplicate code warning: new clone_groups=${{ steps.fallow.outputs.duplicate_count }}"
          echo "Known-intentional groups are filtered; see .github/workflows/build-fallow.yml for the list."
          echo "Please review duplication findings in the log and refactor if needed."

  ai-review-gate:
    needs: build-fallow
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master') && needs.build-fallow.outputs.bypass != 'true'

    steps:
      - name: Post Copilot guidance + request reviewer
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- ai-review-gate-guidance -->';
            const body =
              `${marker}\n` +
              '# AI Review Guidance\n\n' +
              '@copilot Please review this PR.\n\n' +
              'Focus:\n' +
              '- Correctness, safety, and edge cases.\n' +
              '- Consistency with existing patterns and architecture.\n' +
              '- Maintainability: clear naming, minimal coupling, and straightforward control flow.\n' +
              '- Performance only when there is clear impact.\n\n' +
              'Required output:\n' +
              '1. A brief summary of what changed (1-3 bullets).\n' +
              '2. Risks or potential regressions (if any), with severity.\n' +
              '3. Specific, actionable review comments tied to file paths.\n\n' +
              'Use the latest Fallow report comment in this PR as analysis context.\n' +
              'Look for comment marker: <!-- fallow-full-report-main-pr --> and prioritize dead code or duplication findings from that JSON report.';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: issue_number,
                reviewers: ['copilot'],
              });
              core.info('Requested copilot as reviewer.');
            } catch (error) {
              core.warning(`Could not request copilot reviewer automatically: ${error.message}`);
            }
