name: Mirror to Codeberg

on:
  push:
    branches: [ "master" ] 

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetches your entire commit history

      - name: Push to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git remote add codeberg https://tanmay442:$CODEBERG_TOKEN@codeberg.org/tanmay442/PhilosophySpread.git
          
          git push codeberg master --force