# CodeRabbit configuration for PhilosophySpread
# Goal: strict, high-signal reviews focused on correctness, security, performance,
# maintainability, and Astro/Cloudflare best practices.

language: "en-US"

early_access: false

enable_free_tier: true

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  poem: false
  auto_title_placeholder: "[CodeRabbit]"

  # Keep reviews focused and reduce noise from generated/vendor files.
  path_filters:
    - "!**/node_modules/**"
    - "!**/.astro/**"
    - "!**/dist/**"
    - "!**/.wrangler/**"
    - "!**/*.lock"
    - "!**/worker-configuration.d.ts"

  auto_review:
    enabled: true
    drafts: false

  # Extra review guidance for this repository.
  instructions: |
    Repository context:
    - Stack: Astro 6 + TypeScript + Tailwind + Cloudflare deployment.
    - Prioritize production reliability and maintainability.

    Review priorities (highest to lowest):
    1) Correctness and runtime safety.
    2) Security (auth/session handling, secrets, input validation, XSS/CSRF risks).
    3) Performance (bundle size, render path, unnecessary client hydration, repeated work).
    4) Maintainability (clear abstractions, naming, dead code, duplication).
    5) Accessibility and SEO (semantic HTML, alt text, heading structure, metadata correctness).

    Hard rules:
    - Do not approve if changes can break build, type-check, or deploy.
    - Flag any introduced `any` usage unless justified and constrained.
    - Flag unhandled async errors and missing fallback UI/error boundaries.
    - Flag direct secret exposure (env vars rendered to client, logged secrets, etc.).
    - Flag broad try/catch that swallows errors without observability.

    Astro/TypeScript/Tailwind specific checks:
    - Prefer server-rendered components when client interactivity is not required.
    - Use client:* hydration directives only when necessary.
    - Watch for expensive or repeated computations in frontmatter/render paths.
    - Ensure strict TypeScript-safe patterns and narrow types at boundaries.
    - Keep Tailwind class usage readable; suggest extracting repeated utility groups.

    Suggestions quality bar:
    - Give concrete, minimal diffs or code snippets when possible.
    - Prefer actionable fixes over generic advice.
    - Avoid style-only comments unless they improve readability significantly.

    Validation expectations:
    - Mention whether changes are expected to pass:
      - `npm run lint`
      - `npm run build`
    - If not verifiable from diff alone, explicitly say so.

chat:
  auto_reply: false
